# =============================================================================
# Auto-add issues to GitHub Project V2
# Runs when a new issue is opened — adds it to the Pipeline project.
# =============================================================================
name: Add Issue to Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    name: Add to Zan VN Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/zan-ia/projects/2
          github-token: ${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
